name: SQL Deployment Pipeline

on:
  push:

jobs:

  # =========================
  # DEV TEST JOB
  # =========================
  dev-test:
    runs-on: windows-latest

    steps:
      # Notify
      - name: Dev Notification
        shell: pwsh
        run: |
          $body = @{
            text = "DEV TEST STARTED`nRepo: ${{ github.repository }}`
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # Deploy
      - name: Deploy Dev
        uses: ./.github/workflows/sql-template.yml
        with:
          target_env: production 
          secrets: inherit


  # =========================
  # PRODUCTION JOB
  # =========================
  production:
    needs: dev-test
    runs-on: windows-latest

    steps:
      # Notify
      - name: Production Notification
        shell: pwsh
        run: |
          $body = @{
            text = "PRODUCTION STARTED (APPROVAL EXPECTED)`nRepo: ${{ github.repository }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # Deploy
      - name: Deploy Production
        uses: ./.github/workflows/sql-template.yml
        with:
          target_env: partner-production
          secrets: inherit