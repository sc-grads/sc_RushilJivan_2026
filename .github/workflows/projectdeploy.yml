name: SQL Deployment Pipeline

on:
  push:

jobs:

  dev-test:
    runs-on: windows-latest

    steps:
      - name: Dev Notify
        shell: pwsh
        run: |
          $body = @{
            text = "DEV TEST DEPLOYMENT STARTED`nRepo: ${{ github.repository }} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -Body ($body | ConvertTo-Json) `
            -ContentType "application/json"

  dev-deploy:
    needs: dev-test
    uses: ./.github/workflows/sql-template.yml

    with:
      target_env: production

    secrets: inherit


  production:
    needs: dev-deploy
    runs-on: windows-latest

    steps:
      - name: Prod Notify
        shell: pwsh
        run: |
          $body = @{
            text = "PRODUCTION DEPLOYMENT STARTED - REQUIRES APPROVAL: `nRepo: ${{ github.repository }} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} "
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -Body ($body | ConvertTo-Json) `
            -ContentType "application/json"

  prod-deploy:
    needs: production
    uses: ./.github/workflows/sql-template.yml

    with:
      target_env: partner-production

    secrets: inherit





    
 
  success:
    needs: [dev-deploy, prod-deploy]
    runs-on: windows-latest
    if: success()

    steps:
      - name: Success message
        shell: pwsh
        run: |
          $body = @{
            text = "SQL CI/CD PIPELINE COMPLETED SUCCESSFULLY`n(Local + Partner Deployment)`n`nRequested By: ${{ github.actor }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)



  
  failure:
    needs: [dev-deploy, prod-deploy]
    runs-on: windows-latest
    if: failure()

    steps:
      - name: Failure message
        shell: pwsh
        run: |
          $body = @{
            text = "SQL CI/CD PIPELINE FAILED`n`nRepository: ${{ github.repository }}`nTriggered By: ${{ github.actor }}`nCheck GitHub Actions logs for details."
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)