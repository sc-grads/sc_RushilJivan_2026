name: SQL Deployment Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  # =========================
  # JOB 1: Notify Teams FIRST
  # =========================
  notify:
    runs-on: windows-latest

    steps:
      - name: Send approval request to Teams
        shell: pwsh
        run: |
          $body = @{
            text = "SQL Deployment Approval Required`n`nRequested By: ${{ github.actor }}`nRepository: ${{ github.repository }}`nBranch: ${{ github.ref_name }}`n`nPlease approve in GitHub Actions before deployment proceeds."
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)


            
  # =========================
  # JOB 2: Deploy (After Approval)
  # =========================
  deploy:
    needs: notify
    runs-on: windows-latest

    environment:
      name: production

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install SQLCMD
      - name: Install SQLCMD
        run: |
          choco install sqlcmd -y

      # Run SQL Deployment
      - name: Run Deployment Script
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          sqlcmd -S "$env:SQL_SERVER" `
                 -d "$env:SQL_DATABASE" `
                 -U "$env:SQL_USER" `
                 -P "$env:SQL_PASSWORD" `
                 -i "cicd-project/sql/deploy.sql"

      # Success notification
      - name: Deployment success message
        if: success()
        shell: pwsh
        run: |
          $body = @{
            text = "SQL Deployment Successful`n`nRequested By: ${{ github.actor }}`nRepository: ${{ github.repository }}`nBranch: ${{ github.ref_name }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # Failure notification
      - name: Deployment failure message
        if: failure()
        shell: pwsh
        run: |
          $body = @{
            text = "SQL Deployment Failed`n`nRequested By: ${{ github.actor }}`nRepository: ${{ github.repository }}`nBranch: ${{ github.ref_name }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)