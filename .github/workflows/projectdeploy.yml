name: SQL Deployment Pipeline

on:
  push:

jobs:

  # =========================
  # DEV TEST JOB
  # =========================
  dev-test:

    runs-on: windows-latest

    steps:

      # Notify Teams
      - name: Dev Test Notification
        shell: pwsh
        run: |
          $body = @{
            text = "DEV TEST DEPLOYMENT STARTED`nRepo: ${{ github.repository }}`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # Deploy using your WORKING template
      - name: Run Dev Deployment
        uses: ./.github/workflows/sql-template.yml
        secrets: inherit

        with:
          target_env: production

  # =========================
  # PRODUCTION JOB
  # =========================
  production:

    needs: dev-test
    runs-on: windows-latest

    steps:

      # Notify Teams
      - name: Production Notification
        shell: pwsh
        run: |
          $body = @{
            text = "PRODUCTION DEPLOYMENT REQUESTED (APPROVAL REQUIRED)`nRepo: ${{ github.repository }}`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # Deploy using SAME template (but different environment)
      - name: Run Production Deployment
        uses: ./.github/workflows/sql-template.yml
        secrets: inherit

        with:
          target_env: partner-production