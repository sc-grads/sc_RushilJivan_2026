name: SQL Deployment Pipeline

on:
  push:

jobs:

  # =========================
  # JOB 1: DEV TEST
  # =========================
  dev-test:
    runs-on: windows-latest

    steps:

      # NOTIFY
      - name: Dev Notification
        shell: pwsh
        run: |
          $body = @{
            text = "DEV TEST DEPLOYMENT STARTED`nRepo: ${{ github.repository }}`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # DEPLOY (REUSABLE TEMPLATE)
      - name: Run Dev Deployment
        uses: ./.github/workflows/sql-template.yml

        with:
          target_env: production
          secrets: inherit


  # =========================
  # JOB 2: PRODUCTION
  # =========================
  production:
    needs: dev-test
    runs-on: windows-latest

    steps:

      # NOTIFY
      - name: Production Notification
        shell: pwsh
        run: |
          $body = @{
            text = "PRODUCTION DEPLOYMENT STARTED (APPROVAL REQUIRED)`nRepo: ${{ github.repository }}`nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)

      # DEPLOY
      - name: Run Production Deployment
        uses: ./.github/workflows/sql-template.yml

        with:
          target_env: partner-production
          secrets: inherit