name: SQL Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # JOB 1: LOCAL APPROVAL REQUEST
  # =========================
  notify-local:
    runs-on: windows-latest

    steps:
      - name: Send local deployment request to Teams
        shell: pwsh
        run: |
          $body = @{
            text = "LOCAL SQL DEPLOYMENT REQUESTED`n`nRequested By: ${{ github.actor }}`nRepository: ${{ github.repository }}`nBranch: ${{ github.ref_name }}`n`nApprove in GitHub before deployment.`n`nRun Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)


  # =========================
  # JOB 2: LOCAL DEPLOYMENT (REUSABLE TEMPLATE)
  # =========================
  deploy-local:
    needs: notify-local
    uses: ./.github/workflows/sql-deploy-template.yml

    with:
      sql_server: ${{ secrets.SQL_SERVER }}
      sql_database: ${{ secrets.SQL_DATABASE }}
      sql_user: ${{ secrets.SQL_USER }}
      sql_password: ${{ secrets.SQL_PASSWORD }}

    secrets: inherit


  # =========================
  # JOB 3: PARTNER APPROVAL REQUEST
  # =========================
  notify-partner:
    needs: deploy-local
    runs-on: windows-latest

    steps:
      - name: Send partner deployment request to Teams
        shell: pwsh
        run: |
          $body = @{
            text = "PARTNER SQL DEPLOYMENT REQUESTED`n`nRequested By: ${{ github.actor }}`nRepository: ${{ github.repository }}`n`nApprove in GitHub before deployment.`n`nRun Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)


  # =========================
  # JOB 4: PARTNER DEPLOYMENT (REUSABLE TEMPLATE)
  # =========================
  deploy-partner:
    needs: notify-partner
    uses: ./.github/workflows/sql-deploy-template.yml

    with:
      sql_server: ${{ secrets.PARTNER_SQL_SERVER }}
      sql_database: ${{ secrets.SQL_DATABASE }}
      sql_user: ${{ secrets.PARTNER_SQL_USER }}
      sql_password: ${{ secrets.PARTNER_SQL_PASSWORD }}

    secrets: inherit


  # =========================
  # FINAL SUCCESS MESSAGE
  # =========================
  success:
    needs: [deploy-local, deploy-partner]
    runs-on: windows-latest
    if: success()

    steps:
      - name: Success message to Teams
        shell: pwsh
        run: |
          $body = @{
            text = "SQL CI/CD PIPELINE COMPLETED SUCCESSFULLY`n(Local + Partner Deployment)`n`nRequested By: ${{ github.actor }}`nRepository: ${{ github.repository }}"
          }

          Invoke-RestMethod -Method Post `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -ContentType "application/json" `
            -Body ($body | ConvertTo-Json)