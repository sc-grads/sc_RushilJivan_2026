name: Timesheet Automation
 
on:
  workflow_dispatch:
 
jobs:
  # ==========================================
  # JOB 1: LOCAL ENVIRONMENT DEPLOYMENT (DevTest)
  # ==========================================
  DevTest:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: production # Uses your original environment context
 
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS and Create Execution Job (Local)
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetDevTestMigration.ispac file."
            exit 1
        }
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        
        # Local Targeting Naming Rules
        $targetFolder  = "TimesheetDevTestMigration"
        $executionJobName = "RunTimesheetDevTestMigrationPK"
        
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        Write-Host "Establishing tunnel connection via automation_user to Local..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job_Dev')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job_Dev', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Job_Dev', @enabled = 1, @start_step_id = 1;",
                "DECLARE @deploy_script NVARCHAR(MAX);",
                "SET @deploy_script = N'USE [SSISDB]; IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; END DECLARE @project_stream VARBINARY(MAX) = $hexString; EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''TimesheetDevTestMigration'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Job_Dev', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Job_Dev', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Job_Dev';",
                "WAITFOR DELAY '00:00:07';",
                "EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job_Dev';",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for TimesheetDevTestMigration.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\TimesheetDevTestMigration\TimesheetDevTestMigrationPK.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: DevTest Package deployed successfully!"
        } catch {
            Write-Error "Connection or Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }

  # ==========================================
  # JOB 2: PARTNER ENVIRONMENT DEPLOYMENT (Production)
  # ==========================================
  Production:
    name: Production/Deploy
    runs-on: windows-latest
    needs: DevTest # Ensures it only runs if DevTest succeeds
    environment: partner-production # Links to your partner secrets context

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS and Create Execution Job (Partner)
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetDevTestMigration.ispac file."
            exit 1
        }
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        
        # Production Partner Targeting Naming Rules
        $targetFolder  = "TimesheetProductionMigration"
        $executionJobName = "RunTimesheetProductionMigrationPK"
        
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        Write-Host "Establishing tunnel connection via automation_user to Partner Environment..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job_Prod')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job_Prod', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Job_Prod', @enabled = 1, @start_step_id = 1;",
                "DECLARE @deploy_script NVARCHAR(MAX);",
                "SET @deploy_script = N'USE [SSISDB]; IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; END DECLARE @project_stream VARBINARY(MAX) = $hexString; EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''TimesheetProductionMigration'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Job_Prod', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Job_Prod', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Job_Prod';",
                "WAITFOR DELAY '00:00:07';",
                "EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job_Prod';",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for TimesheetProductionMigration.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\TimesheetProductionMigration\TimesheetDevTestMigrationPK.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'Every_1_Minute_8AM_to_5PM', ",
                "    @enabled = 1, ",
                "    @freq_type = 4, ",
                "    @freq_interval = 1, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Production Partner Package deployed and schedule configured successfully!"
        } catch {
            Write-Error "Connection or Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }