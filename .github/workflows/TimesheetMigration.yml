name: Timesheet Automation
 
on:
  workflow_dispatch:
 
jobs:
 
  # ==========================================
  # JOB 1: LOCAL DEPLOYMENT (TEMPORARY JOB METHOD)
  # ==========================================
  DevTest:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: production
 
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS via Temp SQL Job (Local)
      shell: powershell
      run: |
        # STEP 1 LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetDevTestMigration.ispac file."
            exit 1
        }
 
        # STEP 2 DEFINE TARGET CONFIGURATIONS AND ENVIRONMENT VARIABLES
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "TimesheetDevTestMigration"
        $projectName   = "TimesheetDevTestMigration"
        $executionJobName = "RunTimesheetDevTestMigrationPK"
        $packageName   = "TimesheetDevTestMigrationPK"
        $tempJobName   = "GitHub_SSIS_Deploy_Job"
 
        # STEP 3 CONVERT ISPAC FILE INTO BINARY DATA STREAM
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
 
        # STEP 4 CONNECT AND EXECUTE VIA TEMPORARY SQL AGENT JOB
        Write-Host "Establishing tunnel connection via automation_user to Local..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()

            Write-Host "Creating temporary SQL Agent job to run catalog.deploy_project..."
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$tempJobName') BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$tempJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$tempJobName', @enabled = 1, @start_step_id = 1;",
                "DECLARE @deploy_cmd NVARCHAR(MAX);",
                "SET @deploy_cmd = N'USE [SSISDB]; " +
                                  "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN " +
                                  "    EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; " +
                                  "END; " +
                                  "DECLARE @project_stream VARBINARY(MAX) = $hexString; " +
                                  "EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$tempJobName', @step_name = N'Deploy SSIS Binary', @subsystem = N'TSQL', @command = @deploy_cmd, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$tempJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'$tempJobName';"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            
            # Keep network connection alive long enough for the engine threads to pick up the job execution
            Write-Host "Job triggered. Pausing runner for 10 seconds to guarantee deployment execution space..."
            Start-Sleep -Seconds 10
 
            # --- CONFIGURATION PERMANENT EXECUTION TRACKING JOB ---
            Write-Host "Configuring permanent target execution tracking job and schedule..."
            $trackingLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\$packageName.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'1MinuteExecution', ",
                "    @enabled = 1, ",
                "    @freq_type = 4, ",
                "    @freq_interval = 1, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $trackingQuery = $trackingLines -join "`n"
            $trackingCommand = $connection.CreateCommand()
            $trackingCommand.CommandText = $trackingQuery
            $trackingCommand.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Local temporary deployment pipeline flow run completed."
        } catch {
            Write-Error "Local Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }
 
 
  # ==========================================
  # JOB 2: PARTNER SERVER DEPLOYMENT (TEMPORARY JOB METHOD)
  # ==========================================
  Production:
    name: Production/Deploy
    runs-on: windows-latest
    needs: DevTest
    environment: partner-production
 
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS via Temp SQL Job (Partner)
      shell: powershell
      run: |
        # STEP 1 LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetDevTestMigration.ispac file."
            exit 1
        }
 
        # STEP 2 DEFINE TARGET CONFIGURATIONS AND ENVIRONMENT VARIABLES
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "TimesheetProductionMigration"
        $targetProjectName = "TimesheetProductionMigration"
        $executionJobName = "RunTimesheetProductionMigrationPK"
        $tempJobName   = "GitHub_SSIS_Deploy_Job_Prod"
        
        # Source name in repo vs target name for your partner
        $sourcePackageName = "TimesheetDevTestMigrationPK"
        $targetPackageName = "TimesheetProductionMigrationPK"
 
        # STEP 3 DYNAMICALLY UNPACK, RENAME, AND REPACK THE ISPAC
        Write-Host "Unpacking ispac to inject Production partner package name..."
        $workingDir = New-Item -Path ".\ispac_working_prod" -ItemType Directory -Force
        
        Copy-Item $ispacPath "$($workingDir.FullName)\temp.zip"
        Expand-Archive -Path "$($workingDir.FullName)\temp.zip" -DestinationPath "$($workingDir.FullName)\extracted"
        
        $extractedPath = "$($workingDir.FullName)\extracted"
        
        if (Test-Path "$extractedPath\$sourcePackageName.dtsx") {
            Rename-Item -Path "$extractedPath\$sourcePackageName.dtsx" -NewName "$targetPackageName.dtsx"
        } else {
            Write-Error "CRITICAL ERROR: Could not find $sourcePackageName.dtsx inside the extracted ISPAC file."
            exit 1
        }
        
        $manifestPath = "$extractedPath\@Project.manifest"
        (Get-Content $manifestPath) | ForEach-Object {
            $_ -replace "$sourcePackageName.dtsx", "$targetPackageName.dtsx" -replace 'SSIS:Name="TimesheetDevTestMigration"', 'SSIS:Name="TimesheetProductionMigration"'
        } | Set-Content $manifestPath
        
        Remove-Item "$($workingDir.FullName)\temp.zip" -ErrorAction SilentlyContinue
        Compress-Archive -Path "$extractedPath\*" -DestinationPath "$($workingDir.FullName)\modified.zip"
        $modifiedIspacPath = "$($workingDir.FullName)\TimesheetDevTestMigrationModified.ispac"
        Move-Item -Path "$($workingDir.FullName)\modified.zip" -Destination $modifiedIspacPath -Force
 
        $fileBytes = [System.IO.File]::ReadAllBytes($modifiedIspacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        Remove-Item $workingDir -Recurse -Force
 
        # STEP 4 CONNECT AND EXECUTE VIA TEMPORARY SQL AGENT JOB (PARTNER)
        Write-Host "Establishing tunnel connection to partner environment..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()

            Write-Host "Creating partner temporary SQL Agent job to run catalog.deploy_project..."
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$tempJobName') BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$tempJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$tempJobName', @enabled = 1, @start_step_id = 1;",
                "DECLARE @deploy_cmd NVARCHAR(MAX);",
                "SET @deploy_cmd = N'USE [SSISDB]; " +
                                  "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN " +
                                  "    EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; " +
                                  "END; " +
                                  "DECLARE @project_stream VARBINARY(MAX) = $hexString; " +
                                  "EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$targetProjectName'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$tempJobName', @step_name = N'Deploy Partner SSIS Binary', @subsystem = N'TSQL', @command = @deploy_cmd, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$tempJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'$tempJobName';"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            
            Write-Host "Job triggered. Pausing runner for 10 seconds to guarantee partner deployment execution space..."
            Start-Sleep -Seconds 10
 
            # --- CONFIGURATION PERMANENT EXECUTION TRACKING JOB ---
            Write-Host "Configuring partner permanent execution tracking job and schedule..."
            $trackingLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for TimesheetProductionMigration.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$targetProjectName\$targetPackageName.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'1MinuteExecution', ",
                "    @enabled = 1, ",
                "    @freq_type = 4, ",
                "    @freq_interval = 1, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $trackingQuery = $trackingLines -join "`n"
            $trackingCommand = $connection.CreateCommand()
            $trackingCommand.CommandText = $trackingQuery
            $trackingCommand.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Partner deployment completed."
        } catch {
            Write-Error "Partner Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }