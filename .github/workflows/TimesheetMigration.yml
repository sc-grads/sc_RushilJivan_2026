name: Timesheet Automation

on:
  workflow_dispatch:

jobs:

  # JOB 1 LOCAL DEPLOYMENT
  DevTest:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: production

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy SSIS and Create Execution Job (Local)
      shell: powershell
      run: |
        # STEP 1 LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetDevTestMigration.ispac file."
            exit 1
        }

        # STEP 2 DEFINE TARGET CONFIGURATIONS AND ENVIRONMENT VARIABLES 
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "TimesheetDevTestMigration"
        $projectName   = "TimesheetDevTestMigration"
        $executionJobName = "RunTimesheetDevTestMigrationPK"
        $packageName   = "TimesheetDevTestMigrationPK"
        $tempDeployJob = "Temp_SSIS_Deploy_Local"

        # STEP 3 CONVERT ISPAC FILE INTO BINARY HEX STREAM
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

        # STEP 4 INITIALIZE SQL SERVER DATABASE CONNECTION
        Write-Host "Establishing connection via SQL Authentication to Local..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=master;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()
            
            # Step 4a: Create Catalog Folder & Deploy Project using the Temp Job Bypass Method
            Write-Host "Deploying ISPAC project binary stream via automated Local Agent Job..."
            $deployLines = @(
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM sysjobs WHERE name = N'$tempDeployJob') BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$tempDeployJob', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$tempDeployJob', @enabled = 1, @start_step_id = 1;",
                "DECLARE @command NVARCHAR(MAX);",
                "SET @command = N'USE [SSISDB]; ",
                "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN ",
                "    EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; ",
                "END ",
                "DECLARE @project_stream VARBINARY(MAX) = $hexString; ",
                "EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$tempDeployJob', @step_name = N'Run SSIS Deploy', @subsystem = N'TSQL', @command = @command;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$tempDeployJob', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'$tempDeployJob';"
            )
            $deployQuery = $deployLines -join "`n"
            $deployCommand = $connection.CreateCommand()
            $deployCommand.CommandText = $deployQuery
            $deployCommand.ExecuteNonQuery() | Out-Null
            
            # Wait for the async Agent Job to complete by tracking stop_execution_date
            Write-Host "Waiting for temporary local deployment job to complete execution..."
            $jobComplete = $false
            while (-not $jobComplete) {
                Start-Sleep -Seconds 3
                $checkQuery = "SELECT TOP 1 ja.stop_execution_date FROM msdb.dbo.sysjobactivity ja JOIN msdb.dbo.sysjobs j ON ja.job_id = j.job_id WHERE j.name = N'$tempDeployJob' ORDER BY ja.start_execution_date DESC;"
                $checkCmd = $connection.CreateCommand()
                $checkCmd.CommandText = $checkQuery
                $stopDate = $checkCmd.ExecuteScalar()
                
                if ($null -ne $stopDate -and $stopDate -ne [System.DBNull]::Value) { 
                    $jobComplete = $true 
                }
            }
            
            # Final validation check
            $verifyQuery = "SELECT TOP 1 run_status FROM msdb.dbo.sysjobhistory h JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id WHERE j.name = N'$tempDeployJob' AND h.step_id = 1 ORDER BY h.run_date DESC, h.run_time DESC;"
            $verifyCmd = $connection.CreateCommand()
            $verifyCmd.CommandText = $verifyQuery
            $runStatus = $verifyCmd.ExecuteScalar()
            
            # Clean up the temp job immediately
            $cleanupCmd = $connection.CreateCommand()
            $cleanupCmd.CommandText = "EXEC msdb.dbo.sp_delete_job @job_name = N'$tempDeployJob';"
            $cleanupCmd.ExecuteNonQuery() | Out-Null
            
            if ($runStatus -ne 1) {
                Write-Error "CRITICAL: The temporary deployment job failed on the server. Look at msdb history for details."
                exit 1
            }
            Write-Host "SUCCESS: SSIS Catalog Deployment Verified via Automated Agent Service Principal."

            # Step 4b: Configure SQL Server Agent Job and Schedule tracking configurations
            Write-Host "Configuring SQL Agent Execution tracking job..."
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for TimesheetDevTestMigration.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\$packageName.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'$' + N'ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'1MinuteExecution', ",
                "    @enabled = 1, ",
                "    @freq_type = 4, ",
                "    @freq_interval = 1, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Local deployment and scheduling completed fully."
        } catch {
            Write-Error "Local Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }

  # JOB 2 PARTNER SERVER DEPLOYMENT
  Production:
    name: Production/Deploy
    runs-on: windows-latest
    needs: DevTest
    environment: partner-production

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy SSIS and Create Execution Job (Partner)
      shell: powershell
      run: |
        # STEP 1 LOCATE THE SSIS DEPLOYMENT FILE 
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetDevTestMigration\TimesheetDevTestMigration\bin\Development\TimesheetDevTestMigration.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetDevTestMigration.ispac file."
            exit 1
        }

        # STEP 2 DEFINE TARGET CONFIGURATIONS AND ENVIRONMENT VARIABLES
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "TimesheetProductionMigration"
        $targetProjectName = "TimesheetProductionMigration"
        $executionJobName = "RunTimesheetProductionMigrationPK"
        $tempDeployJob = "Temp_SSIS_Deploy_Prod"
        
        # Source name in repo vs target name for your partner
        $sourcePackageName = "TimesheetDevTestMigrationPK"
        $targetPackageName = "TimesheetProductionMigrationPK"

        # STEP 3 DYNAMICALLY UNPACK, RENAME, AND REPACK THE ISPAC VIA XML NATIVE
        Write-Host "Unpacking ispac to inject Production partner package name..."
        $workingDir = New-Item -Path ".\ispac_working_prod" -ItemType Directory -Force
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        
        Copy-Item $ispacPath "$($workingDir.FullName)\temp.zip"
        [System.IO.Compression.ZipFile]::ExtractToDirectory("$($workingDir.FullName)\temp.zip", "$($workingDir.FullName)\extracted")
        $extractedPath = "$($workingDir.FullName)\extracted"
        
        # 1. Physical file rename inside deployment container
        if (Test-Path "$extractedPath\$sourcePackageName.dtsx") {
            Rename-Item -Path "$extractedPath\$sourcePackageName.dtsx" -NewName "$targetPackageName.dtsx"
        } else {
            Write-Error "CRITICAL ERROR: Could not find $sourcePackageName.dtsx inside the extracted ISPAC file."
            exit 1
        }
        
        # 2. Modify internal definitions using precise XML DOM tree targeting
        $manifestPath = "$extractedPath\Project.manifest"
        if (-not (Test-Path $manifestPath)) {
            $manifestPath = "$extractedPath\@Project.manifest"
        }
        
        [xml]$xml = Get-Content $manifestPath
        
        # FIX: Force explicit XML Attribute mutations to bypass .NET object type lockouts
        $xml.Project.SetAttribute("Name", $targetProjectName)
        
        # Target and alter individual child package reference elements via Attribute accessors
        $xml.Project.Packages.Package | ForEach-Object {
            if ($_.GetAttribute("Name") -eq "$sourcePackageName.dtsx") {
                $_.SetAttribute("Name", "$targetPackageName.dtsx")
            }
        }
        $xml.Save($manifestPath)
        
        # 3. Compress container payload via reliable Zip Extraction Assembly
        Remove-Item "$($workingDir.FullName)\temp.zip" -ErrorAction SilentlyContinue
        $modifiedIspacPath = "$($workingDir.FullName)\TimesheetDevTestMigrationModified.ispac"
        [System.IO.Compression.ZipFile]::CreateFromDirectory($extractedPath, $modifiedIspacPath)

        # Convert archive into deployment hex payload string stream
        $fileBytes = [System.IO.File]::ReadAllBytes($modifiedIspacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        Remove-Item $workingDir -Recurse -Force

        # STEP 4 INITIALIZE SQL SERVER DATABASE CONNECTION OVER NETWORK TUNNEL
        Write-Host "Establishing tunnel connection to partner environment..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=master;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()
            
            # Step 4a: Create Catalog Folder & Deploy Project using the Temp Job Bypass Method
            Write-Host "Deploying ISPAC project binary stream directly to partner SSISDB Catalog..."
            $deployLines = @(
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM sysjobs WHERE name = N'$tempDeployJob') BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$tempDeployJob', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$tempDeployJob', @enabled = 1, @start_step_id = 1;",
                "DECLARE @command NVARCHAR(MAX);",
                "SET @command = N'USE [SSISDB]; ",
                "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN ",
                "    EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; ",
                "END ",
                "DECLARE @project_stream VARBINARY(MAX) = $hexString; ",
                "EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$targetProjectName'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$tempDeployJob', @step_name = N'Run SSIS Deploy', @subsystem = N'TSQL', @command = @command;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$tempDeployJob', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'$tempDeployJob';"
            )
            $deployQuery = $deployLines -join "`n"
            $deployCommand = $connection.CreateCommand()
            $deployCommand.CommandText = $deployQuery
            $deployCommand.ExecuteNonQuery() | Out-Null
            
            # Wait for the async Agent Job to complete by tracking stop_execution_date
            Write-Host "Waiting for temporary partner deployment job to complete execution..."
            $jobComplete = $false
            while (-not $jobComplete) {
                Start-Sleep -Seconds 3
                $checkQuery = "SELECT TOP 1 ja.stop_execution_date FROM msdb.dbo.sysjobactivity ja JOIN msdb.dbo.sysjobs j ON ja.job_id = j.job_id WHERE j.name = N'$tempDeployJob' ORDER BY ja.start_execution_date DESC;"
                $checkCmd = $connection.CreateCommand()
                $checkCmd.CommandText = $checkQuery
                $stopDate = $checkCmd.ExecuteScalar()
                
                if ($null -ne $stopDate -and $stopDate -ne [System.DBNull]::Value) { 
                    $jobComplete = $true 
                }
            }
            
            # Final validation check
            $verifyQuery = "SELECT TOP 1 run_status FROM msdb.dbo.sysjobhistory h JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id WHERE j.name = N'$tempDeployJob' AND h.step_id = 1 ORDER BY h.run_date DESC, h.run_time DESC;"
            $verifyCmd = $connection.CreateCommand()
            $verifyCmd.CommandText = $verifyQuery
            $runStatus = $verifyCmd.ExecuteScalar()
            
            if ($runStatus -ne 1) {
                Write-Host "==================== DETAILED ERROR DIAGNOSTIC LOG ===================="
                $errQuery1 = "SELECT TOP 1 message FROM msdb.dbo.sysjobhistory h JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id WHERE j.name = N'$tempDeployJob' AND h.step_id = 1 ORDER BY h.run_date DESC, h.run_time DESC;"
                $errCmd1 = $connection.CreateCommand()
                $errCmd1.CommandText = $errQuery1
                $agentMsg = $errCmd1.ExecuteScalar()
                Write-Host "SQL Agent Failure Message: $agentMsg"
                
                $errQuery2 = "SELECT TOP 1 message FROM [SSISDB].[catalog].[operation_messages] WHERE operation_id = (SELECT MAX(operation_id) FROM [SSISDB].[catalog].[operations] WHERE message_source_type = 10) ORDER BY message_time DESC;"
                $errCmd2 = $connection.CreateCommand()
                $errCmd2.CommandText = $errQuery2
                $ssisMsg = $errCmd2.ExecuteScalar()
                Write-Host "SSISDB Catalog Internal Log Reason: $ssisMsg"
                Write-Host "======================================================================="

                $cleanupCmd = $connection.CreateCommand()
                $cleanupCmd.CommandText = "EXEC msdb.dbo.sp_delete_job @job_name = N'$tempDeployJob';"
                $cleanupCmd.ExecuteNonQuery() | Out-Null

                Write-Error "CRITICAL: The temporary partner deployment job failed on the server. Review the Diagnostic log printed above."
                exit 1
            }
            
            # Clean up the temp job on successful run
            $cleanupCmd = $connection.CreateCommand()
            $cleanupCmd.CommandText = "EXEC msdb.dbo.sp_delete_job @job_name = N'$tempDeployJob';"
            $cleanupCmd.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: SSIS Project successfully written to partner catalog."

            # STEP 5 CONFIGURING TARGET EXECUTION SCHEDULER JOB
            Write-Host "Configuring SQL Agent Execution tracking job..."
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for TimesheetProductionMigration.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$targetProjectName\$targetPackageName.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'$' + N'ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'1MinuteExecution', ",
                "    @enabled = 1, ",
                "    @freq_type = 4, ",
                "    @freq_interval = 1, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Partner deployment and scheduling completed fully."
        } catch {
            Write-Error "Partner Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }