name: SSIS CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================================
    # PHASE 1: CONTINUOUS INTEGRATION (COMPILATION VIA DEVENV)
    # ==========================================
    - name: Locate Visual Studio DevEnv Tool
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        if (-not $vsPath) { 
            $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath 
        }
        $devenvDir = Split-Path $vsPath
        $devenvCom = Join-Path $devenvDir "devenv.com"
        
        if (Test-Path $devenvCom) {
            Write-Host "Found Visual Studio compiler at: $devenvCom"
            echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "CRITICAL ERROR: Visual Studio (devenv.com) was not found on this self-hosted runner."
        }

    - name: Build SSIS Project to ISPAC
      shell: powershell
      run: |
        # Compiles the SSIS project using the precise subfolder path wrapped in quotes
        & "${{ env.DEVENV_PATH }}" ".\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\TimesheetNew.dtproj" /Build "Development"
        
        # Verifies that the compiled binary deployment bundle was generated successfully
        if (Test-Path ".\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\*.ispac") {
            Write-Host "Success: .ispac deployment bundle created cleanly."
        } else {
            Throw "Build completed, but the compiled .ispac artifact was not found inside the target bin path."
        }

    - name: Upload Compiled Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ssis-deployment-package
        path: .\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\*.ispac

    # ==========================================
    # PHASE 2: CONTINUOUS DEPLOYMENT (SHIPPING VIA LOCAL WINDOWS AUTH)
    # ==========================================
    - name: Deploy to SSISDB Catalog
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: powershell
      run: |
        # Force install/import of the modern SqlServer module if missing
        if (-not (Get-Module -ListAvailable -Name SqlServer)) {
            Write-Host "Installing required SqlServer PowerShell module natively..."
            Install-Module -Name SqlServer -Force -AllowClobber -Scope CurrentUser
        }
        Import-Module SqlServer -DisableNameChecking

        # Target server connection matched to your exact named instance
        $serverName = "LAPTOP-66HI94H2\Rushil Jivan"  
        $folderName = "TimesheetDeployments"
        
        # Locate the compiled binary package
        $projectPath = Get-ChildItem -Path ".\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\*.ispac" | Select-Object -ExpandProperty FullName
        $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
        
        Write-Host "Deploying project $projectName to SSISDB:\$folderName via Publish-MtsProject..."
        
        # Deploy using the native compiled cmdlet for reliability across runner contexts
        Publish-MtsProject -InstanceName $serverName -CatalogName "SSISDB" -FolderName $folderName -ProjectFilePath $projectPath
        
        Write-Host "Deployment completed successfully!"