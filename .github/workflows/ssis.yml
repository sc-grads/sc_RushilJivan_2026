name: Deploy SSIS and Agent Job Pipeline

on:
  push:
    #branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-pipeline:
    runs-on: self-hosted  # Executes directly on your laptop via your local runner

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy SSIS Package to Catalog
      shell: powershell
      run: |
        # 1. Force-load SQL Server Management Assemblies from local installation paths
        $TargetDLLs = @(
            "Microsoft.SqlServer.Management.Sdk.Sfc.dll", 
            "Microsoft.SqlServer.ConnectionInfo.dll", 
            "Microsoft.SqlServer.Management.IntegrationServices.dll"
        )
        
        # Hunt down the specific DLL files inside your Program Files directory
        foreach ($dll in $TargetDLLs) {
            $FoundFile = Get-ChildItem -Path "C:\Program Files\Microsoft SQL Server" -Filter $dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($FoundFile) {
                [System.Reflection.Assembly]::LoadFrom($FoundFile.FullName) | Out-Null
            }
        }

        # Fallback registration names to ensure system context is satisfied
        [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.ConnectionInfo") | Out-Null
        [System.Reflection.Assembly]::LoadWithPartialName("Microsoft.SqlServer.Management.IntegrationServices") | Out-Null
        
        # Configuration details matching your specific machine environment
        $serverName = "LAPTOP-66HI94H2\Rushil Jivan"
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
        
        # 2. Connect to local SSISDB Catalog
        $connectionString = "Data Source=$serverName;Initial Catalog=master;Integrated Security=SSPI;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connectionString)
        
        # Direct type evaluation using brackets to eliminate ambiguity
        $integrationServices = New-Object ([Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices]) $connection
        
        $catalog = $integrationServices.Catalogs["SSISDB"]
        $folder = $catalog.Folders["TimesheetProject"]
        
        # 3. Read the binary array contents of the compiled .ispac and deploy it
        [byte[]]$projectContent = [System.IO.File]::ReadAllBytes($ispacPath)
        $folder.DeployProject("TimesheetDeployment", $projectContent)
        Write-Host "SSIS Project successfully deployed to Catalog."

    - name: Deploy and Configure SQL Server Agent Job
      shell: powershell
      run: |
        # Embed the automated SQL configuration logic inside a safe PowerShell string block
        $sqlScript = @"
        USE [msdb];

        -- 1. CLEANUP: Clear any older iterations of the job to ensure clean builds
        IF EXISTS (SELECT job_id FROM dbo.sysjobs WHERE name = N'ETL_Timesheet_Job')
        BEGIN
            EXEC dbo.sysjobs_updates_disabled_check @@SPID; -- Safety hook execution check
            EXEC dbo.sp_delete_job @job_name = N'ETL_Timesheet_Job', @delete_unused_schedule = 1;
        END;

        -- 2. CREATE THE AGENT CONTROLLER JOB
        DECLARE @JobID BINARY(16);
        EXEC dbo.sp_add_job 
            @job_name = N'ETL_Timesheet_Job', 
            @enabled = 1, 
            @description = N'Automated 1-minute runner for Timesheet and Leave SSIS pipeline.',
            @job_id = @JobID OUTPUT;

        -- 3. ATTACH WORKFLOW STEP: Point directly to the newly pushed Integration Services package
        EXEC dbo.sp_add_jobstep 
            @job_id = @JobID, 
            @step_name = N'Execute SSIS Package', 
            @subsystem = N'SSIS', 
            @command = N'/ISSERVER "\"\SSISDB\TimesheetProject\TimesheetDeployment\Package.dtsx\"" /SERVER "\"LAPTOP-66HI94H2\Rushil Jivan\"" /Par "\"$ServerOption::LOGGING_LEVEL(Int16)\"";1', 
            @retry_attempts = 0, 
            @retry_interval = 0;

        -- 4. CREATE 1-MINUTE CRON INTERVAL SCHEDULE
        EXEC dbo.sp_add_jobschedule 
            @job_id = @JobID, 
            @name = N'EveryMinuteSchedule', 
            @enabled = 1, 
            @freq_type = 4,         -- Daily evaluation interval
            @freq_interval = 1,     -- Triggers every calendar day
            @freq_subday_type = 4,  -- Units set to minutes
            @freq_subday_interval = 1, -- Triggers every 1 minute
            @active_start_date = 20260101, -- Operational setup alignment
            @active_end_date = 99991231,
            @active_start_time = 0,
            @active_end_time = 235959;

        -- 5. INSTANCE ROUTING LINKAGE
        EXEC dbo.sp_add_jobserver @job_id = @JobID, @server_name = N'(local)';
        
        
        "@
        # Fire the query using the local loopback port connection
        Invoke-Sqlcmd -ServerInstance "127.0.0.1,1433" -Query $sqlScript
        Write-Host "SQL Server Agent Job successfully deployed and scheduled for 1-minute cycles."