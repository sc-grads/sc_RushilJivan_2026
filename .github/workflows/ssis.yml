name: Deploy SSIS and Agent Job Pipeline

on:
  push:
    #branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-pipeline:
    runs-on: self-hosted  # Executes directly on your laptop via your local runner

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy SSIS Package via Command Line Utility
      shell: powershell
      run: |
        $serverName = "LAPTOP-66HI94H2\Rushil Jivan"
        
        # Define the path based on your repository structure
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
        
        # Fallback check: If the workspace path doubled up your repo folder name, shift down one level
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }

        # Clear error exit safety if the file is completely missing from the runner check directory
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL: Could not locate TimesheetNew.ispac on the file system. Check repository path structures."
            exit 1
        }
        
        # Hunt down the native SQL Server Deployment Wizard executive file on your laptop
        $deployWizard = Get-ChildItem -Path "C:\Program Files\Microsoft SQL Server" -Filter "ISDeploymentWizard.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        
        if (-not $deployWizard) {
            $deployWizard = Get-ChildItem -Path "C:\Program Files (x86)\Microsoft SQL Server" -Filter "ISDeploymentWizard.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }
        
        if (-not $deployWizard) {
            Write-Error "Could not find ISDeploymentWizard.exe on this computer. Ensure SSMS or Client Tools SDK is installed."
            exit 1
        }
        
        Write-Host "Found deployment engine at: $deployWizard"
        Write-Host "Verified active target file: $ispacPath"
        
        # Run the deployment silently in server-to-server mode (/Silent)
        & $deployWizard /Silent /SourcePath:"$ispacPath" /DestinationServer:"$serverName" /DestinationPath:"/SSISDB/TimesheetProject/TimesheetDeployment"
        
        if ($LASTEXITCODE -eq 0) {
            Write-Host "SSIS Project successfully deployed to Catalog via native CLI."
        } else {
            Write-Error "Deployment wizard failed with exit code $LASTEXITCODE. Verify that the SSISDB catalog and folder path '/SSISDB/TimesheetProject' exists in SSMS."
            exit 1
        }

    - name: Deploy and Configure SQL Server Agent Job
      shell: powershell
      run: |
        $sqlScript = @"
        USE [msdb];

        -- 1. CLEANUP: Clear any older iterations of the job to ensure clean builds
        IF EXISTS (SELECT job_id FROM dbo.sysjobs WHERE name = N'ETL_Timesheet_Job')
        BEGIN
            EXEC dbo.sp_delete_job @job_name = N'ETL_Timesheet_Job', @delete_unused_schedule = 1;
        END;

        -- 2. CREATE THE AGENT CONTROLLER JOB
        DECLARE @JobID BINARY(16);
        EXEC dbo.sp_add_job 
            @job_name = N'ETL_Timesheet_Job', 
            @enabled = 1, 
            @description = N'Automated 1-minute runner for Timesheet and Leave SSIS pipeline.',
            @job_id = @JobID OUTPUT;

        -- 3. ATTACH WORKFLOW STEP: Point directly to the newly pushed Integration Services package
        EXEC dbo.sp_add_jobstep 
            @job_id = @JobID, 
            @step_name = N'Execute SSIS Package', 
            @subsystem = N'SSIS', 
            @command = N'/ISSERVER "\"\SSISDB\TimesheetProject\TimesheetDeployment\Package.dtsx\"" /SERVER "\"LAPTOP-66HI94H2\Rushil Jivan\"" /Par "\"$ServerOption::LOGGING_LEVEL(Int16)\"";1', 
            @retry_attempts = 0, 
            @retry_interval = 0;

        -- 4. CREATE 1-MINUTE CRON INTERVAL SCHEDULE
        EXEC dbo.sp_add_jobschedule 
            @job_id = @JobID, 
            @name = N'EveryMinuteSchedule', 
            @enabled = 1, 
            @freq_type = 4,         
            @freq_interval = 1,     
            @freq_subday_type = 4,  
            @freq_subday_interval = 1, 
            @active_start_date = 20260101, 
            @active_end_date = 99991231,
            @active_start_time = 0,
            @active_end_time = 235959;

        -- 5. INSTANCE ROUTING LINKAGE
        EXEC dbo.sp_add_jobserver @job_id = @JobID, @server_name = N'(local)';

        "@
        
        # Fire the query using the local loopback port connection
        Invoke-Sqlcmd -ServerInstance "127.0.0.1,1433" -Query $sqlScript
        Write-Host "SQL Server Agent Job successfully deployed and scheduled for 1-minute cycles."