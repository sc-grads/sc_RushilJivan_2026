name: SSIS CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Prevents broken submodule tracking references from failing the checkout phase
        submodules: false  

    # ==========================================
    # PHASE 1: CONTINUOUS INTEGRATION (COMPILATION VIA DEVENV)
    # ==========================================
    - name: Locate Visual Studio DevEnv Tool
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        if (-not $vsPath) { 
            $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath 
        }
        $devenvDir = Split-Path $vsPath
        $devenvCom = Join-Path $devenvDir "devenv.com"
        
        if (Test-Path $devenvCom) {
            Write-Host "Found Visual Studio compiler at: $devenvCom"
            echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "CRITICAL ERROR: Visual Studio (devenv.com) was not found on this self-hosted runner."
        }

    - name: Build SSIS Project to ISPAC
      shell: powershell
      run: |
        # Compiles the SSIS project using the designated directory path
        & "${{ env.DEVENV_PATH }}" ".\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\TimesheetNew.dtproj" /Build "Development"
        
        # Verifies that the compiled binary deployment bundle was generated successfully
        if (Test-Path ".\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\*.ispac") {
            Write-Host "Success: .ispac deployment bundle created cleanly."
        } else {
            Throw "Build completed, but the compiled .ispac artifact was not found inside the target bin path."
        }

    - name: Upload Compiled Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ssis-deployment-package
        path: .\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\*.ispac

    # ==========================================
    # PHASE 2: DIAGNOSTIC LOCAL CONNECTION DEPLOYMENT
    # ==========================================
    - name: Deploy to SSISDB Catalog
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      shell: powershell
      run: |
        # Locate the freshly built binary package and unpack it into memory as a hex string
        $projectPath = Get-ChildItem -Path ".\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\*.ispac" | Select-Object -ExpandProperty FullName
        $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectPath)
        
        Write-Host "Reading $projectName binary package data..."
        $fileBytes = [System.IO.File]::ReadAllBytes($projectPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

        $folderName = "TimesheetDeployments"
        
        # Standard multi-line string encapsulation to bypass YAML syntax exceptions
        $deployQuery = "
        SET NOCOUNT ON;
        IF NOT EXISTS (SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = '$folderName')
        BEGIN
            EXEC [SSISDB].[catalog].[create_folder] @folder_name = '$folderName';
        END
        DECLARE @project_binary VARBINARY(MAX) = $hexString;
        EXEC [SSISDB].[catalog].[deploy_project] 
            @folder_name = '$folderName', 
            @project_name = '$projectName', 
            @project_stream = @project_binary;
        "

        # Diagnostic connection strings matrix using single quotes for clean literal execution
        $targets = @(
            @{ Name = "Standard Named Instance"; ConnectionString = "Server=localhost\Rushil Jivan;Database=master;Integrated Security=True;TrustServerCertificate=True;" },
            @{ Name = "Network Named Instance";  ConnectionString = "Server=LAPTOP-66HI94H2\Rushil Jivan;Database=master;Integrated Security=True;TrustServerCertificate=True;" },
            @{ Name = "Default Port Loopback";   ConnectionString = "Server=127.0.0.1,1433;Database=master;Integrated Security=True;TrustServerCertificate=True;" }
        )

        $success = $false
        foreach ($target in $targets) {
            Write-Host "--- Testing Connection Channel: $($target.Name) ---"
            
            $connection = New-Object System.Data.SqlClient.SqlConnection($target.ConnectionString)
            $command = New-Object System.Data.SqlClient.SqlCommand($deployQuery, $connection)
            
            try {
                $connection.Open()
                $command.ExecuteNonQuery() | Out-Null
                Write-Host "SUCCESS: Connected and Deployed via $($target.Name)!"
                $success = $true
                break
            } catch {
                Write-Warning "Failed path $($target.Name): $_"
            } finally {
                $connection.Close()
            }
        }

        if (-not $success) {
            Throw "CRITICAL: All local database connection pathways failed. Proceed to check service runtime logs for permission profiles."
        }