name: Deploy SSIS via Pinggy Tunnel

on:
  push:

jobs:
  deploy-via-tunnel:
    name: Tunnel Deployment to Local Laptop
    runs-on: windows-latest  
    environment: production  
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy via Agent Job Workaround
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
        
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }

        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetNew.ispac file."
            exit 1
        }

        # Pull secrets
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "LocalDeployments"

        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

        Write-Host "Establishing tunnel connection via automation_user..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        
        try {
            $connection.Open()
            
            # T-SQL script that drops/creates a temporary Agent Job.
            # Because the Agent Job runs under the SQL Agent Windows Service account, 
            # it satisfies Microsoft's Integrated Authentication requirement perfectly.
            $sqlQuery = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Job', @enabled = 1, @start_step_id = 1;",
                "DECLARE @deploy_script NVARCHAR(MAX);",
                "SET @deploy_script = N'",
                "USE [SSISDB];",
                "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'')",
                "BEGIN",
                "    EXEC [catalog].[create_folder] @folder_name = N''$targetFolder'';",
                "END",
                "DECLARE @project_stream VARBINARY(MAX) = $hexString;",
                "EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''TimesheetNew'', @project_stream = @project_stream;'",
                "EXEC dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Job', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Job', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Job';",
                "WAITFOR DELAY '00:00:05';",
                "IF EXISTS (SELECT 1 FROM msdb.dbo.sysjobhistory h JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id WHERE j.name = N'GitHub_SSIS_Deploy_Job' AND h.run_status = 1)",
                "BEGIN",
                "    PRINT 'SUCCESS';",
                "END",
                "ELSE",
                "BEGIN",
                "    RAISERROR('Agent Job execution failed or timed out.', 16, 1);",
                "END",
                "EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job';"
            ) -join "`n"

            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: automation_user successfully initiated deployment via local Windows service layer!"
        } catch {
            Write-Error "Connection or Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }