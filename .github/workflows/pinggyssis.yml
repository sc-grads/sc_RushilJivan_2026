name: Deploy SSIS via Pinggy Tunnel

on:
  push:

jobs:
  deploy-via-tunnel:
    name: Tunnel Deployment to Local Laptop
    runs-on: windows-latest  
    environment: production  
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Extract and Stream ISPAC Binary via Tunnel
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
        
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }

        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetNew.ispac file."
            exit 1
        }

        # Pull secrets
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "LocalDeployments"

        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

        Write-Host "Establishing tunnel connection to local database instance..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        
        try {
            $connection.Open()
            
            # This line escalates the session to 'sa' context to bypass the Integrated Auth rule
            $sqlQuery = @(
                "SET NOCOUNT ON;",
                "USE [SSISDB];",
                "EXECUTE AS LOGIN = 'sa';", 
                "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = '$targetFolder')",
                "BEGIN",
                "    EXEC [catalog].[create_folder] @folder_name = N'$targetFolder';",
                "END",
                "DECLARE @project_stream VARBINARY(MAX) = $hexString;",
                "EXEC [catalog].[deploy_project] @folder_name = N'$targetFolder', @project_name = N'TimesheetNew', @project_stream = @project_stream;",
                "REVERT;"
            ) -join "`n"

            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: SSIS Project successfully streamed over Pinggy tunnel into SSISDB under '$targetFolder'!"
        } catch {
            Write-Error "Connection or Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }