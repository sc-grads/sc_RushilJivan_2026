name: Deploy SSIS via Pinggy Tunnel

on:
  push:

jobs:
  deploy-via-tunnel:
    name: Tunnel Deployment to Local Laptop
    runs-on: windows-latest
    environment: production

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy SSIS and Create Execution Job
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetNew.ispac file."
            exit 1
        }
        $tunnelAddress = "${{ secrets.SQL_SERVER }}"
        $dbUser        = "${{ secrets.SQL_USER }}"
        $initialDb     = "${{ secrets.SQL_DATABASE }}"
        $dbPassword    = "${{ secrets.SQL_PASSWORD }}"
        $targetFolder  = "LocalDeployments"
        $executionJobName = "Run_TimesheetNew_Package"
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        
        Write-Host "Establishing direct tunnel connection to deploy..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()
            $sqlLines = @(
                "SET NOCOUNT ON;",
                
                # 1. Direct Deployment to SSISDB (No temp job needed!)
                "USE [SSISDB];",
                "IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = '$targetFolder') ",
                "BEGIN ",
                "    EXEC [catalog].[create_folder] @folder_name = N'$targetFolder'; ",
                "END;",
                "DECLARE @project_stream VARBINARY(MAX) = $hexString;",
                "EXEC [catalog].[deploy_project] @folder_name = N'$targetFolder', @project_name = N'TimesheetNew', @project_stream = @project_stream;",
                
                # 2. Setup the Permanent Execution Job
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for TimesheetNew.', @start_step_id = 1;",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\TimesheetNew\Package1.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @@SERVERNAME + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                
                # 3. Apply Schedule
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'Every_1_Minute_8AM_to_5PM', ",
                "    @enabled = 1, ",
                "    @freq_type = 4, ",
                "    @freq_interval = 1, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: SSIS Package deployed directly and scheduled Agent Job '$executionJobName' updated!"
        } catch {
            Write-Error "Connection or Direct Execution Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }