name: Deploy SSIS via Pinggy Tunnel

on:
  workflow_dispatch:

jobs:
  deploy-via-tunnel:
    name: Tunnel Deployment to Local Laptop
    runs-on: windows-latest  
    environment: production  # Automatically loads your environment-specific secrets
    
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Deploy ISPAC via Command Line Wizard
      shell: powershell
      run: |
        # 1. Locate the compiled deployment package file
        $ispacPath = "${{ github.workspace }}\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
        
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing workspace folder structural correction path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet Project\SSIS\TimesheetNew\TimesheetNew\bin\Development\TimesheetNew.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }

        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate TimesheetNew.ispac file."
            exit 1
        }

        # 2. Parse the dynamic Pinggy tunnel address into separate Host and Port variables
        # Maps "tcpb-xyz.pinggy.link,45678" -> Host: tcpb-xyz.pinggy.link | Port: 45678
        $rawAddress = "${{ secrets.SQL_SERVER }}"
        if (-not $rawAddress.Contains(',')) {
            Write-Error "CRITICAL: SQL_SERVER secret must be formatted with a comma delimiter (e.g., host.pinggy.link,port)"
            exit 1
        }
        
        $serverParts = $rawAddress.Split(',')
        $tunnelHost  = $serverParts[0].Trim()
        $tunnelPort  = $serverParts[1].Trim()

        $dbUser      = "${{ secrets.SQL_USER }}"
        $dbPassword  = "${{ secrets.LOCAL_SQL_PASSWORD }}"
        $targetFolder = "LocalDeployments"

        Write-Host "Routing deployment via local machine ISDeploymentWizard endpoint..."
        Write-Host "Target Server Host: $tunnelHost on Port: $tunnelPort"
        
        # 3. Locate the Deployment Wizard utility installed natively on the GitHub Cloud runner environment
        # GitHub's windows-latest image comes pre-installed with the SQL Server tools
        $wizardPath = "C:\Program Files (x86)\Microsoft SQL Server\160\DTS\Binn\ISDeploymentWizard.exe"
        if (-not (Test-Path -Path $wizardPath)) {
            # Fallback path if matching an alternative versioning directory layout
            $wizardPath = "C:\Program Files (x86)\Microsoft SQL Server\150\DTS\Binn\ISDeploymentWizard.exe"
        }

        # 4. Fire the silent execution string to pass credentials cleanly over the proxy link
        & $wizardPath `
          /Silent `
          /SourceType:File `
          /SourcePath:"$ispacPath" `
          /DestinationType:Server `
          /DestinationServer:"$tunnelHost,$tunnelPort" `
          /DestinationPath:"/SSISDB/$targetFolder/TimesheetNew" `
          /AuthenticationType:Sql `
          /User:"$dbUser" `
          /Password:"$dbPassword"

        # 5. Catch validation output exit flags
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Deployment wizard failed with execution exit code: $LASTEXITCODE"
            exit 1
        }

        Write-Host "SUCCESS: SSIS Project successfully pushed through the proxy tunnel into your SSISDB Catalog!"