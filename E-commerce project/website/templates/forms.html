<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">

    <title>Ville Cycles | {% block title %}{% endblock %}</title>

    <style>
        :root {
            --primary-color: #0EA5E9;
            --secondary-color: #1E293B;
        }

        body {
            background-color: #0f172a !important;
            background-image: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.1) 0%, transparent 65%) !important;
            min-height: 100vh;
            margin: 0;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .base,
        .base-content {
            background-color: transparent !important;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form {
            background-color: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(14, 165, 233, 0.25) !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(14, 165, 233, 0.08) !important;
        }

        .btn-primary,
        .form input[type="submit"],
        .buttons input {
            background-color: #0EA5E9 !important;
            border-color: #0EA5E9 !important;
            color: #ffffff !important;
        }

        .btn-primary:hover,
        .form input[type="submit"]:hover,
        .buttons input:hover {
            background-color: #0284C7 !important;
            border-color: #0284C7 !important;
        }
    </style>
</head>

<body>

    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
